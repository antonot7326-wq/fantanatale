name: Pubblica su GitHub Pages

on:
  push:
    branches: [main, vibe/fantanatale-prototipo-831fdf]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  administration: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4
      - name: Attiva Pages se necessario
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Installa Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installa dipendenze
        run: npm ci
      - name: Crea la build
        run: npm run build
      - name: Prepara l'artefatto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
