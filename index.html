<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fantacalcio natalizio con i familiari come giocatori: asta, formazioni, bonus e malus, una giornata per ogni giorno delle feste." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icon-192.png" sizes="192x192" />
    <meta name="theme-color" content="#12a05f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FantaNatale" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta property="og:title" content="FantaNatale" />
    <meta property="og:description" content="Fantacalcio natalizio di famiglia: asta, formazioni, bonus e malus assegnati dall'host, una giornata per ogni giorno delle feste." />
    <meta property="og:type" content="website" />
    <title>FantaNatale</title>
    <script>
      try {
        var t = localStorage.getItem('fantanatale-theme')
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: sans-serif; padding: 2rem; text-align: center;">
        FantaNatale ha bisogno di JavaScript attivo per funzionare.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
